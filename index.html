<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SoundCloud Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sc-orange: #ff5500;
        }
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .skeleton {
            background: linear-gradient(90deg, var(--tg-theme-secondary-bg-color, #f0f0f0) 25%, var(--tg-theme-bg-color, #ffffff) 50%, var(--tg-theme-secondary-bg-color, #f0f0f0) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-artist { border: 4px solid var(--sc-orange); grayscale: 0; }
    </style>
</head>
<body class="pb-24">

    <div id="onboarding" class="fixed inset-0 z-[100] bg-[var(--tg-theme-bg-color)] p-6 overflow-y-auto hidden">
        <h1 class="text-3xl font-black mb-2">Твой <span style="color: var(--sc-orange)">Вкус</span></h1>
        <p class="opacity-60 mb-8">Выбери 3 артиста для начала.</p>
        <div id="artistGrid" class="grid grid-cols-3 gap-4 mb-24"></div>
        <div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[var(--tg-theme-bg-color)] to-transparent">
            <button id="startAppBtn" disabled class="w-full bg-gray-400 text-white py-4 rounded-2xl font-bold opacity-50">
                Выбрано: <span id="selectedCount">0</span>/3
            </button>
        </div>
    </div>

    <div id="app" class="p-4">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black italic tracking-tighter text-[var(--sc-orange)]">SOUNDCLOUD</h1>
            <button onclick="resetPreferences()" class="opacity-40"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg></button>
        </div>

        <div class="relative mb-6">
            <input type="text" id="searchInput" placeholder="Поиск треков..." class="w-full p-4 rounded-2xl bg-[var(--tg-theme-secondary-bg-color)] border-none outline-none text-sm">
        </div>

        <div id="mainContent">
            <h2 class="text-xs font-bold uppercase opacity-50 mb-4 tracking-widest">Твои подборки</h2>
            <div id="personalFeed" class="flex gap-4 overflow-x-auto no-scrollbar pb-4"></div>
            
            <h2 class="text-xs font-bold uppercase opacity-50 my-4 tracking-widest">Топ жанры</h2>
            <div class="grid grid-cols-2 gap-3 mb-8">
                <div onclick="searchSC('Phonk')" class="h-20 rounded-2xl bg-zinc-900 p-3 flex items-end font-bold text-white">Phonk</div>
                <div onclick="searchSC('Deep House')" class="h-20 rounded-2xl bg-orange-600 p-3 flex items-end font-bold text-white">Deep House</div>
            </div>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <audio id="mainAudio"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // !!! ЗАМЕНИ ЭТУ ССЫЛКУ НА СВОЮ ОТ VERCEL !!!
        const PROXY_URL = "https://muz11111.vercel.app/api";

        const audio = document.getElementById('mainAudio');
        let currentPlaylist = [];
        let currentIndex = -1;
        let selectedArtists = [];

        // Инициализация базы данных IndexedDB
        let db;
        const dbReq = indexedDB.open("MusicDB", 1);
        dbReq.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("tracks", { keyPath: "id" });
        };
        dbReq.onsuccess = (e) => db = e.target.result;

        const artists = [
            { name: 'Lana Del Rey', img: 'https://picsum.photos/200?1' },
            { name: 'The Weeknd', img: 'https://picsum.photos/200?2' },
            { name: 'Travis Scott', img: 'https://picsum.photos/200?3' },
            { name: 'Miyagi', img: 'https://picsum.photos/200?4' },
            { name: 'Drake', img: 'https://picsum.photos/200?5' },
            { name: 'Zivert', img: 'https://picsum.photos/200?6' }
        ];

        function init() {
            const saved = localStorage.getItem('my_favorite_artists');
            if (!saved) {
                document.getElementById('onboarding').classList.remove('hidden');
                renderOnboarding();
            } else {
                selectedArtists = JSON.parse(saved);
                loadPersonalFeed();
            }
        }

        function renderOnboarding() {
            const grid = document.getElementById('artistGrid');
            grid.innerHTML = artists.map(a => `
                <div onclick="toggleArtist('${a.name}', this)" class="text-center">
                    <img src="${a.img}" class="w-full aspect-square rounded-2xl object-cover grayscale transition-all">
                    <p class="text-[10px] mt-2 opacity-70">${a.name}</p>
                </div>
            `).join('');
        }

        function toggleArtist(name, el) {
            const img = el.querySelector('img');
            if (selectedArtists.includes(name)) {
                selectedArtists = selectedArtists.filter(n => n !== name);
                img.classList.remove('active-artist');
            } else {
                selectedArtists.push(name);
                img.classList.add('active-artist');
            }
            updateOnboardingBtn();
        }

        function updateOnboardingBtn() {
            const btn = document.getElementById('startAppBtn');
            const count = document.getElementById('selectedCount');
            count.innerText = selectedArtists.length;
            if (selectedArtists.length >= 3) {
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-orange-600');
                btn.classList.remove('opacity-50');
            }
        }

        document.getElementById('startAppBtn').onclick = () => {
            localStorage.setItem('my_favorite_artists', JSON.stringify(selectedArtists));
            document.getElementById('onboarding').classList.add('hidden');
            loadPersonalFeed();
        };

        function loadPersonalFeed() {
            const feed = document.getElementById('personalFeed');
            feed.innerHTML = selectedArtists.map(name => `
                <div onclick="searchSC('${name}')" class="flex-shrink-0 w-24 text-center">
                    <div class="w-20 h-20 mx-auto rounded-full bg-orange-100 flex items-center justify-center text-orange-600 font-bold">
                        ${name[0]}
                    </div>
                    <p class="text-[10px] mt-2 truncate">${name}</p>
                </div>
            `).join('');
        }

        async function searchSC(query) {
            document.getElementById('mainContent').style.display = 'none';
            showSkeletons();
            try {
                const res = await fetch(`${PROXY_URL}/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderTracks(data.collection);
            } catch (e) {
                tg.showAlert("Ошибка поиска");
            }
        }

        function showSkeletons() {
            document.getElementById('results').innerHTML = Array(5).fill(`
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-xl skeleton"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-4 w-3/4 rounded skeleton"></div>
                        <div class="h-3 w-1/2 rounded skeleton"></div>
                    </div>
                </div>
            `).join('');
        }

        function renderTracks(tracks) {
            currentPlaylist = tracks;
            document.getElementById('results').innerHTML = tracks.map((t, i) => `
                <div class="flex items-center gap-4">
                    <div class="flex-1 flex items-center gap-4" onclick="playTrack(${i})">
                        <img src="${t.artwork_url || 'https://via.placeholder.com/150'}" class="w-14 h-14 rounded-xl object-cover">
                        <div class="min-w-0">
                            <p class="font-bold text-sm truncate">${t.title}</p>
                            <p class="text-xs opacity-50">${t.user.username}</p>
                        </div>
                    </div>
                    <button onclick="downloadTrack(${i}, this)" class="p-2 text-orange-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </button>
                </div>
            `).join('');
        }

        function playTrack(index) {
            currentIndex = index;
            const track = currentPlaylist[index];
            
            // Здесь мы используем наш эндпоинт редиректа для воспроизведения
            audio.src = `${PROXY_URL}/download?url=${encodeURIComponent(track.permalink_url)}`;
            audio.play();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.user.username,
                    artwork: [{ src: track.artwork_url || '', sizes: '512x512', type: 'image/png' }]
                });
            }
            tg.HapticFeedback.impactOccurred('light');
        }

        async function downloadTrack(index, btn) {
            const track = currentPlaylist[index];
            btn.innerHTML = "...";
            try {
                const res = await fetch(`${PROXY_URL}/download?url=${encodeURIComponent(track.permalink_url)}`);
                const blob = await res.blob();
                const tx = db.transaction("tracks", "readwrite");
                tx.objectStore("tracks").put({ id: track.id, title: track.title, blob: blob });
                btn.innerHTML = "✅";
                tg.HapticFeedback.notificationOccurred('success');
            } catch (e) {
                btn.innerHTML = "❌";
            }
        }

        audio.onended = () => {
            if (currentIndex < currentPlaylist.length - 1) playTrack(currentIndex + 1);
        };

        function resetPreferences() {
            tg.showConfirm("Сбросить любимых артистов?", (ok) => {
                if (ok) {
                    localStorage.clear();
                    location.reload();
                }
            });
        }

        document.getElementById('searchInput').onkeypress = (e) => {
            if (e.key === 'Enter') searchSC(e.target.value);
        };

        init();
    </script>
</body>
</html>
